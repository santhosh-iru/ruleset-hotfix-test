name: Create hotfix branch (deploy key)
on:
  workflow_dispatch:
    inputs:
      base: {description: "Release commit or branch", required: true}
      name: {description: "Hotfix name", required: true}
permissions:
  contents: read
jobs:
  create:
    runs-on: ubuntu-latest
    environment: hotfix-creator
    steps:
      - name: Report whether the key is visible
        env: {K: "${{ secrets.HOTFIX_DEPLOY_KEY }}"}
        run: if [ -n "$K" ]; then echo "KEY_PRESENT"; else echo "KEY_ABSENT"; fi
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.HOTFIX_DEPLOY_KEY }}
          fetch-depth: 0
      - name: Push the new branch with the deploy key
        run: git push origin "origin/${{ inputs.base }}:refs/heads/hotfix/${{ inputs.name }}"
