name: Preview input test
on:
  workflow_dispatch:
    inputs:
      new_only:
        description: Only in the new branch's file
        type: string
        required: false
jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "file=new ref=${{ github.ref }}"
          echo 'inputs=${{ toJSON(inputs) }}'
          echo 'event.inputs=${{ toJSON(github.event.inputs) }}'
